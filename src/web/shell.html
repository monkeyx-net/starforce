<!doctype html>
<!-- Page for the Emscripten build (-DCMAKE_TOOLCHAIN_FILE=.../Emscripten.cmake); {{{ SCRIPT }}} loads the game. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Force</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; outline: none; }
  #status { position: fixed; color: #888; font: 14px monospace; }
</style>
</head>
<body>
<div id="status">Loading...</div>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
  var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: function (text) { document.getElementById('status').textContent = text; },
    onRuntimeInitialized: function () { Module.setStatus(''); Module.canvas.focus(); }
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
